[carrier]
subcarrier_spacing_khz = 30
cyclic_prefix = "normal"
n_cell_id = 0
n_size_grid = 50
n_start_grid = 0
frame_number = 0
slot_number = 0

[pusch]
waveform = "dft_s_ofdm"
mapping_type = "A"
symbol_allocation = [0, 14]
n_size_bwp = 50
n_start_bwp = 0
mcs_table = 1
mcs_index = 20
dmrs_config_type = 1
dmrs_type_a_position = 2
dmrs_additional_position = 0
dmrs_num_cdm_groups_without_data = 2
dmrs_beta = 1.4125375446227544
# This RX capture uses native OCC-first low-PAPR port ordering; the MATLAB
# transmitter fixture uses the default comb-first ordering.
dft_s_dmrs_port_order = "native"

[[users]]
name = "ue0"
n_rnti = 1456
dmrs_ports = [0]

[[users]]
name = "ue1"
n_rnti = 1460
dmrs_ports = [1]

[[users]]
name = "ue2"
n_rnti = 1457
dmrs_ports = [2]

[[users]]
name = "ue3"
n_rnti = 1459
dmrs_ports = [3]

[receiver]
channel_estimator = "dmrs"
input_domain = "frequency"
# Tuned on the supplied captures: a wider DMRS tap basis and a lower noise
# floor decode all four transport blocks of RxTestVector.h5 and
# RxTestVectorCase11121314 with zero payload bit errors, and raise the
# RxTestVectorCase78914 pass count from 2/4 CRC to 3/4.
noise_variance = 0.001
detector = "mmse-pic"
# PIC iterations and soft-symbol damping for the mmse-pic detector.
detector_parameter = 8
detector_damping = 0.5
max_delay_spread_s = 6e-6
