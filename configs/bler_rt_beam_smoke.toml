[bler]
snr_db = [60.0, 80.0]
batch_size = 1
max_frames_per_snr = 2
target_block_errors = 8
seed = 13
num_decoder_iterations = 20
channel_estimator = "dmrs"
channel_estimators = ["perfect", "dmrs"]
detector = "lmmse"
detectors = ["beam-independent", "zf", "lmmse", "lmmse-sic", "k-best", "ep", "mmse-pic", "soft-mmse-pic"]
detector_parameters = { "k-best" = 16, "ep" = 10, "mmse-pic" = 4, "soft-mmse-pic" = 1 }
detector_damping = 0.25
device = "cpu"
channel_domain = "frequency"
l_min = -6
max_delay_spread_s = 3e-6
stop_at_zero_bler = false
