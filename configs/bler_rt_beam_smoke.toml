[bler]
snr_db = [10.0, 15, 20]
batch_size = 10
max_frames_per_snr = 100
target_block_errors = 10
seed = 13
num_decoder_iterations = 20
channel_estimator = "dmrs"
channel_estimators = ["dmrs"]
detector = "lmmse"
detectors = ["beam-independent", "zf", "lmmse", "soft-mmse-pic"]
detector_parameters = { "k-best" = 16, "ep" = 10, "mmse-pic" = 4, "soft-mmse-pic" = 4 }
detector_damping = 0.25
device = "cuda:0"
channel_domain = "frequency"
l_min = -6
max_delay_spread_s = 3e-6
stop_at_zero_bler = true
