[bler]
# Starter web matrix: three channel estimators × soft-MMSE-PIC at two SNRs.
# Generate this prior with the documented estimator-validation command first.
snr_db = [25.0, 30.0, 35.0, 40.0, 45.0, 50.0]
batch_size = 8
max_frames_per_snr = 2000
target_block_errors = 100
seed = 20260924
num_decoder_iterations = 20
channel_estimator = "dmrs"
channel_estimators = ["dmrs", "dmrs-lmmse", "perfect"]
dmrs_tap_power_prior_path = "/tmp/channel_estimation_validation.prior.npz"
detector = "soft-mmse-pic"
detectors = ["soft-mmse-pic"]
detector_parameters = { "soft-mmse-pic" = 4 }
detector_damping = 0.25
device = "cuda:0"
channel_domain = "frequency"
l_min = -6
max_delay_spread_s = 3e-6
estimate_delay = false
stop_at_zero_bler = false
