# Delay-offset estimator is diagnostic only; all other settings match baseline.
[bler]
snr_db = [20.0, 25.0, 30.0]
batch_size = 1
max_frames_per_snr = 8
target_block_errors = 1000000000
seed = 20260924
num_decoder_iterations = 20
channel_estimator = "dmrs"
detector = "soft-mmse-pic"
detector_parameter = 1
detector_damping = 0.25
detectors = ["soft-mmse-pic"]
device = "cpu"
channel_domain = "frequency"
l_min = -6
estimate_delay = true
stop_at_zero_bler = false
