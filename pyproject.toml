[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nr-pusch-lab"
version = "0.1.0"
description = "Small Sionna-based NR PUSCH waveform and IQ analysis toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["sionna==2.0.1", "h5py>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
nr-pusch-tx = "nr_pusch.cli.tx:main"
nr-pusch-channel = "nr_pusch.cli.channel:main"
nr-pusch-bler = "nr_pusch.cli.bler:main"
nr-pusch-rx = "nr_pusch.cli.rx:main"

[tool.setuptools.packages.find]
where = ["src"]
